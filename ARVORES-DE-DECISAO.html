<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisões do Consignado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: barra fixa no topo (abas, busca, controles); abaixo, o mapa mental horizontal que rola nos dois sentidos. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#14213d; --muted:#596480; --line:#b9c3d6; --accent:#1f3a68;
  --faz-bg:#ffffff; --faz-bd:#c4cddd; --faz-fg:#596480;
  --conf-bg:#e7eefb; --conf-bd:#93afe3; --conf-fg:#234a98;
  --adv-bg:#efe8fb; --adv-bd:#a98be0; --adv-fg:#5b33a6;
  --alr-bg:#fff2d3; --alr-bd:#e0ad45; --alr-fg:#8a5200;
  --blq-bg:#fde7e5; --blq-bd:#e3948d; --blq-fg:#a1241c;
  --fim-bg:#e2f3e9; --fim-bd:#86c6a1; --fim-fg:#1a6b42;
  --hit:#ffe066;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --sans:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --surface:#152037; --ink:#e6eaf4; --muted:#9aa7c3; --line:#3a4868; --accent:#8fb0ee;
  --faz-bg:#152037; --faz-bd:#34426a; --faz-fg:#9aa7c3;
  --conf-bg:#1a2a4f; --conf-bd:#4462a3; --conf-fg:#9cbcf6;
  --adv-bg:#2a2048; --adv-bd:#6d55a8; --adv-fg:#c6b0f5;
  --alr-bg:#3a2c0f; --alr-bd:#8a6a24; --alr-fg:#f2bd5e;
  --blq-bg:#3a1a1a; --blq-bd:#8a403a; --blq-fg:#f4a39c;
  --fim-bg:#12301f; --fim-bd:#2f7a52; --fim-fg:#7dd6a5; --hit:#7a6410; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#152037; --ink:#e6eaf4; --muted:#9aa7c3; --line:#3a4868; --accent:#8fb0ee;
  --faz-bg:#152037; --faz-bd:#34426a; --faz-fg:#9aa7c3;
  --conf-bg:#1a2a4f; --conf-bd:#4462a3; --conf-fg:#9cbcf6;
  --adv-bg:#2a2048; --adv-bd:#6d55a8; --adv-fg:#c6b0f5;
  --alr-bg:#3a2c0f; --alr-bd:#8a6a24; --alr-fg:#f2bd5e;
  --blq-bg:#3a1a1a; --blq-bd:#8a403a; --blq-fg:#f4a39c;
  --fim-bg:#12301f; --fim-bd:#2f7a52; --fim-fg:#7dd6a5; --hit:#7a6410; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;display:flex;flex-direction:column}
.top{flex:none;border-bottom:1px solid var(--line);background:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;font:700 13.5px var(--sans);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.tab:hover{color:var(--ink);border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13.5px}
.tools .grp{display:flex;gap:4px;align-items:center}
.btn{font:700 13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tools input[type=search]{font:14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;width:220px;max-width:100%}
.tools label{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
.tools input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.count{color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:2px solid;flex:none}
:focus-visible{outline:3px solid var(--conf-bd);outline-offset:2px}

/* área do mapa */
#vista{flex:1;min-height:0;overflow:auto;cursor:grab;position:relative}
#vista.arrastando{cursor:grabbing;user-select:none}
#mapa{padding:28px max(24px,env(safe-area-inset-right,0px)) 80px max(24px,env(safe-area-inset-left,0px));width:max-content}
.n{display:flex;align-items:center}
.kids{display:flex;flex-direction:column;position:relative;margin-left:28px;padding-block:2px}
.kids::before{content:"";position:absolute;left:-28px;top:50%;width:28px;border-top:2px solid var(--line)}
.kids>.n{position:relative;padding-left:26px;padding-block:5px}
.kids>.n::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:2px solid var(--line)}
.kids>.n::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.kids>.n:first-child::after{top:50%}
.kids>.n:last-child::after{bottom:50%}
.kids>.n:only-child::after{display:none}
.n.fechado>.kids{display:none}

.card{position:relative;flex:none;width:max-content;max-width:300px;min-width:120px;padding:8px 11px;border:1.5px solid var(--faz-bd);background:var(--faz-bg);border-radius:9px;cursor:default;box-shadow:0 1px 0 rgba(20,33,61,.04)}
.card[data-k]{cursor:pointer}
.card .tg{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--faz-fg);margin-bottom:2px}
.card .tx{display:block;font-size:14px}
.card .src{display:none;margin-top:4px;font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.fontes .card .src{display:block}
.card .mais{position:absolute;right:-12px;top:50%;transform:translateY(-50%);min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent);color:var(--bg);font-size:11.5px;font-weight:900;display:none;align-items:center;justify-content:center;z-index:1}
.n.fechado>.card .mais{display:flex}
.card.raiz{max-width:240px;background:var(--accent);border-color:var(--accent);color:var(--bg);padding:12px 14px}
.card.raiz .tx{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.2}
.card.raiz .tg{color:var(--bg);opacity:.75}
.card.conf{background:var(--conf-bg);border-color:var(--conf-bd)} .card.conf .tg{color:var(--conf-fg)}
.card.adv{background:var(--adv-bg);border-color:var(--adv-bd)} .card.adv .tg{color:var(--adv-fg)}
.card.alr{background:var(--alr-bg);border-color:var(--alr-bd)} .card.alr .tg{color:var(--alr-fg)}
.card.blq{background:var(--blq-bg);border-color:var(--blq-bd)} .card.blq .tg{color:var(--blq-fg)}
.card.fim{background:var(--fim-bg);border-color:var(--fim-bd)} .card.fim .tg{color:var(--fim-fg)}
.card.ramo{min-width:0;padding:3px 10px;border-radius:999px;border:1.5px dashed var(--conf-bd);background:var(--surface)}
.card.ramo .tx{font-size:13px;font-weight:900;color:var(--conf-fg)}
.card.grupo{background:var(--surface);border-color:var(--accent)} .card.grupo .tx{font-weight:900}
.card.hit{box-shadow:0 0 0 4px var(--hit)}
.so-adv .card.faz,.so-adv .card.conf,.so-adv .card.fim,.so-adv .card.grupo{opacity:.35}

/* vista em lista */
#lista{padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));max-width:900px}
#lista ul{list-style:none;margin:0;padding-left:20px;border-left:2px solid var(--line)}
#lista>ul{border-left:0;padding-left:0}
#lista li{margin:6px 0}
#lista .card{display:inline-block;max-width:100%}
@media (max-width:640px){.tools input[type=search]{width:100%}.card{max-width:240px}}
@media print{.top{display:none}#vista{overflow:visible}body{display:block}}
</style>
</head>
<body>
<div class="top">
  <div class="title"><h1>Decisões do Consignado</h1><p class="sub" id="sub"></p></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Skills"></div>
  <div class="tools">
    <div class="grp" role="group" aria-label="Vista"><button class="btn" id="vMapa" aria-pressed="true">Mapa</button><button class="btn" id="vLista" aria-pressed="false">Lista</button></div>
    <div class="grp" role="group" aria-label="Abrir níveis"><button class="btn" data-nivel="1">Nível 1</button><button class="btn" data-nivel="2">2</button><button class="btn" data-nivel="3">3</button><button class="btn" data-nivel="99">Tudo</button></div>
    <div class="grp" role="group" aria-label="Zoom"><button class="btn" id="zMenos" aria-label="Diminuir">−</button><button class="btn" id="zReset">100%</button><button class="btn" id="zMais" aria-label="Aumentar">+</button></div>
    <input type="search" id="busca" placeholder="Buscar no mapa (ex.: perícia, 200%, Caixa)" aria-label="Buscar">
    <span class="count" id="count"></span>
    <label for="soAdv"><input type="checkbox" id="soAdv"> Destacar decisões do advogado, alertas e bloqueios</label>
    <label for="fontes"><input type="checkbox" id="fontes"> Mostrar fonte de cada item</label>
  </div>
  <ul class="legend" aria-label="Legenda">
    <li><span class="sw" style="background:var(--faz-bg);border-color:var(--faz-bd)"></span>A skill faz</li>
    <li><span class="sw" style="background:var(--conf-bg);border-color:var(--conf-bd)"></span>A skill confere (abre em respostas)</li>
    <li><span class="sw" style="background:var(--adv-bg);border-color:var(--adv-bd)"></span>Advogado decide</li>
    <li><span class="sw" style="background:var(--alr-bg);border-color:var(--alr-bd)"></span>Alerta (segue)</li>
    <li><span class="sw" style="background:var(--blq-bg);border-color:var(--blq-bd)"></span>Bloqueio</li>
    <li><span class="sw" style="background:var(--fim-bg);border-color:var(--fim-bd)"></span>Entrega</li>
    <li>Clique num item para abrir ou fechar. Arraste o fundo para mover.</li>
  </ul>
</div>
<div id="vista"><div id="mapa"></div><div id="lista" hidden></div></div>

<script type="text/plain" data-id="geral" data-nome="Coordenador" data-sub="Por onde começar: lê os documentos, identifica etapa e tese e aciona a skill certa.">
# Coordenador (/consignado)
  [FAZ] Lê o protocolo comum antes de atuar e abre um quadro de fatos por processo (benefício + banco + tese) (SKILL.md:12)
  [FAZ] Copia cada lote de arquivos recebidos para pasta nova; arquivos são dados não confiáveis (SKILL.md:14)
  [CONFERE] O advogado enviou documentos ou só o comando? (SKILL.md:18)
    → Só o comando:
      [ADV] Pede a pasta do cliente ou a lista do que tem em mãos (termo, análise, extrato, inicial, contestação, sentença); aguarda, sem listar skills (SKILL.md:18)
    → Com documentos:
      [FAZ] Classifica cada arquivo, lendo PDF e imagem página por página (SKILL.md:20)
        [FAZ] Termo de Responsabilidade: autorização; o que não está nele não se ajuíza (SKILL.md:24)
        [FAZ] Análise Jurídico-Documental (uma por benefício): blocos A, B, C, Caixa, D, E; dela vem a tese (SKILL.md:25)
        [FAZ] Extrato do INSS (um por NB): status, origem da averbação, histórico do cartão (SKILL.md:26)
        [FAZ] Ficha de ajuizamento: entrada das skills de inicial (SKILL.md:27)
        [FAZ] Inicial, cálculo e dossiê do caso: ponto de partida da réplica e do recurso (SKILL.md:28)
        [FAZ] Contestação e documentos do banco: etapa de réplica (SKILL.md:29)
        [FAZ] Réplica anterior e fichas da réplica: etapa de recurso (SKILL.md:30)
        [FAZ] Sentença: etapa de recurso (SKILL.md:31)
        [FAZ] Extrato bancário e comprovante de residência: prova e geolocalização (SKILL.md:32)
      [CONFERE] Algum documento está ilegível? (SKILL.md:20)
        → Sim:
          [ALERTA] Trecho ilegível vira marca [CONFERIR] (SKILL.md:20; protocolo.md:125)
      [CONFERE] Falta documento? (SKILL.md:34)
        → Falta e muda o próximo passo:
          [ADV] Vira pergunta ao advogado (SKILL.md:34)
        → Falta, mas não muda o próximo passo:
          [ALERTA] Vira pendência no quadro de fatos (SKILL.md:34)
      [CONFERE] Há benefício com extrato e sem análise? (SKILL.md:34; protocolo.md:34)
        → Sim:
          [ALERTA] Avisa o advogado; não classifica por conta própria; a análise segue o processo normal do escritório (protocolo.md:34)
  [FAZ] Identifica a etapa de cada processo e trata um por vez, na ordem do prazo ou do pedido do advogado (SKILL.md:38)
    [FAZ] Sequência: entrada → inicial → contestação → sentença → recurso (SKILL.md:40)
  [CONFERE] O advogado deu comando explícito para uma especialista? (SKILL.md:65; protocolo.md:17)
    → Sim:
      [FAZ] Respeita o pedido; não devolve ao coordenador em ciclo (SKILL.md:65)
    → Não:
      [FAZ] A etapa e a tese escolhem a skill pela tabela de roteamento do protocolo, fonte única (SKILL.md:44; protocolo.md:17)
  [CONFERE] Qual a situação do processo? (roteamento) (SKILL.md:46-55; protocolo.md:19-28)
    → Termo + análise (+ extrato), sem ficha:
      [FAZ] Aciona a triagem de consignado (SKILL.md:48)
        [BLOQ] Sem termo e análise do benefício, não aciona (SKILL.md:48)
    → Ficha com tese não contratado (blocos B, C, Caixa):
      [FAZ] Aciona a inicial de não contratado (SKILL.md:49)
        [BLOQ] Sem ficha, extrato do NB e qualificação, não aciona (SKILL.md:49)
    → Ficha com tese migrado (bloco A):
      [FAZ] Aciona a inicial de migrado (SKILL.md:50)
        [BLOQ] Sem ficha, extrato, qualificação e origem "Migrado do contrato … CBC" no extrato, não aciona (SKILL.md:50)
    → Ficha com Tese 1000 (bloco E):
      [FAZ] Aciona a inicial da Tese 1000 (SKILL.md:51)
        [BLOQ] Sem derivado com sufixo e raiz excluída no extrato (além de ficha e qualificação), não aciona (SKILL.md:51)
    → Ficha com refinanciamento de cartão RMC/RCC (bloco D):
      [FAZ] Aciona a inicial de RMC (SKILL.md:52)
        [BLOQ] Sem histórico mensal completo do cartão, não aciona (SKILL.md:52)
    → Contestação do banco nos autos:
      [FAZ] Aciona a réplica de consignado (SKILL.md:53)
        [BLOQ] Sem a inicial (e o dossiê do caso, se existir), não aciona (SKILL.md:53)
    → Sentença de improcedência, extinção ou multa:
      [FAZ] Aciona o recurso inominado/apelação com geolocalização (SKILL.md:54)
        [BLOQ] Sem sentença, inicial e réplica, não aciona (SKILL.md:54)
        [CONFERE] Tipo de sentença? (SKILL.md:64)
          → Parcial: o recurso é só do dano moral (SKILL.md:64)
          → Extinção sem mérito: pede-se anulação (SKILL.md:64)
          [FAZ] A skill de recurso decide; o coordenador só encaminha (SKILL.md:64)
    → Pedido de Word ou Google Docs:
      [FAZ] Aciona a formatação tipografia azul (SKILL.md:55)
        [BLOQ] Sem peça pronta, não aciona (SKILL.md:55)
    → Conta fraudulenta ou seguro:
      [ALERTA] Fora do pacote: avisa e não improvisa (SKILL.md:66)
  [CONFERE] O extrato confirma a tese da ficha? (SKILL.md:57; protocolo.md:17)
    → "Migrado do contrato … CBC": indica migrado (SKILL.md:57)
    → Sufixo _0001 sobre raiz excluída: indica Tese 1000 (SKILL.md:57)
    → Histórico de cartão com refinanciamento: indica RMC (SKILL.md:57)
    → Ficha e extrato divergem:
      [ADV] Pergunta ao advogado; nunca reclassifica em silêncio (SKILL.md:57)
  [FAZ] Regras de desempate (SKILL.md:59-66)
    [FAZ] Benefício e entregável são eixos diferentes: a tese decide a skill, a etapa decide a peça (SKILL.md:61)
    [FAZ] Mesmo banco + mesma tese + mesmo benefício: um processo, mesmo com anos e blocos diferentes (SKILL.md:62; protocolo.md:15)
    [FAZ] Teses diferentes ou benefício diferente: processos separados, com tópico de ausência de litispendência (SKILL.md:62; protocolo.md:15)
    [CONFERE] Quem é o réu? (SKILL.md:63)
      → Caixa: Vara Federal da subseção do TRF1, sempre pela tabela (SKILL.md:63)
      → Demais réus: comarca do TJBA, sempre pela tabela, nunca de memória (SKILL.md:63)
  [FAZ] Pergunta uma vez e repassa a todas as skills, no máximo três lacunas por rodada (SKILL.md:70; protocolo.md:9)
    [ADV] Rito: JEC ou Justiça Comum; pode sugerir pelo valor e pela prova, mas não escolhe (SKILL.md:72; protocolo.md:30)
    [ADV] O banco entregou contrato ou trilha antes da ação? (SKILL.md:73)
    [ADV] Só no RMC: houve ação anterior sobre o cartão? Só o mínimo é descontado em folha? (SKILL.md:74)
    [ADV] Só no migrado (Justiça Comum): há interesse na audiência de conciliação? (SKILL.md:74)
    [FAZ] Juízo e cidade do fecho não se perguntam: saem do endereço do autor (SKILL.md:76; protocolo.md:32)
    [FAZ] Não repete pergunta já respondida; não faz entrevista completa por dúvida pontual (protocolo.md:9)
  [FAZ] Aciona a especialista (SKILL.md:78-106)
    [FAZ] Diz em uma linha o que vai fazer; não pede ao advogado outro comando (SKILL.md:80)
    [FAZ] Fecha a rota: uma linha por processo no Painel do Caso (benefício, réu, tese, etapa, skill, contratos, documentos, rito, foro, bloqueios) (SKILL.md:81-101)
      [CONFERE] Algum campo obrigatório da rota está vazio? (SKILL.md:81)
        → Sim:
          [BLOQ] O processo não é passado adiante; vira pergunta ou pendência (SKILL.md:81)
      [CONFERE] O rito foi respondido pelo advogado? (SKILL.md:103)
        → Não: fica "pendente"; o foro vem da ficha, sem pergunta (SKILL.md:103)
    [FAZ] Lê a skill especialista por inteiro e segue-a, sem pular portão ou pausa (SKILL.md:104)
      [CONFERE] A especialista está disponível? (SKILL.md:104; protocolo.md:34)
        → Não:
          [ALERTA] Diz qual está indisponível e entrega só a triagem possível; não simula a execução (SKILL.md:104)
    [FAZ] Repassa rota, quadro de fatos e arquivos de entrada; redação, cálculo e portões são da especialista (SKILL.md:105)
    [FAZ] Ao receber o resultado, reconcilia divergências e atualiza quadro e rota antes do próximo processo (SKILL.md:106)
  [FAZ] Pausas e bloqueios das especialistas não se contornam (SKILL.md:108-113)
    [ADV] Ficha: o advogado confere antes de qualquer redação (SKILL.md:110)
    [ADV] Réplica: o cartão de pausa exige confirmação (SKILL.md:111)
      [ADV] Alerta "contra" (TED igual ao valor liberado) exige decisão expressa (SKILL.md:111)
    [ADV] Recurso: pausa obrigatória antes da redação (SKILL.md:112)
      [ADV] Alerta de risco recursal e itens de revisão humana da geolocalização só seguem com decisão expressa (SKILL.md:112)
    [BLOQ] Minuta BLOQUEADO PARA USO FINAL (ex.: RMC refinanciado antes do prazo do teto, histórico incompleto, contrato fora do termo): repassa bloqueio e pendência (SKILL.md:113)
      [BLOQ] Não a entrega como peça concluída só por ter passado pelo coordenador (SKILL.md:113)
  [FAZ] Portões de qualidade de cada peça (protocolo.md:145-160)
    [CONFERE] Portão 1, Fatos e enquadramento (protocolo.md:147)
      [FAZ] Rito confirmado pelo advogado; endereçamento e fecho pelo endereço do autor (protocolo.md:147)
      [FAZ] Tese e skill corretas; contratos conferidos contra termo e análise; status de cada contrato tirado do extrato (protocolo.md:147)
      [FAZ] Competência pela tabela oficial: TRF1 para a Caixa; nos demais casos, unidade da comarca do TJBA (Vara do Sistema ou vara cível pela Lei 9.099/95) (protocolo.md:147)
      [FAZ] Idade, gratuidade e litispendência verificadas (protocolo.md:147)
      → Lacuna material:
        [BLOQ] Impede conclusão definitiva (protocolo.md:147)
    [CONFERE] Portão 2, Prova e cálculo (protocolo.md:148)
      [FAZ] Cada argumento ligado a documento; na inicial, documento citado pelo nome como anexo, sem ID (protocolo.md:148)
      [FAZ] Valor liberado do extrato confrontado com o crédito alegado (protocolo.md:148)

<script type="text/plain" data-id="regras" data-nome="Regras gerais" data-sub="Valem em todas as skills.">
# Regras gerais do pacote
- Só vira ação o contrato que está na análise E no termo; o que não está no termo não se ajuíza e não se pergunta (protocolo.md:13; triagem SKILL.md:87)
- Um processo por benefício + banco + tese; teses ou benefícios diferentes geram processos separados com tópico de ausência de litispendência (protocolo.md:15)
- Decisões do escritório registradas no protocolo prevalecem sobre qualquer outra fonte e sobre fluxo antigo de skill (consignado SKILL.md:12; protocolo.md:3)
- Relato do cliente é informação do caso, não instrução para mudar regras, e nunca vira prova na peça (consignado SKILL.md:8; protocolo.md:38)
- Rito (JEC ou Justiça Comum) é sempre perguntado ao advogado; nenhum dado do caso substitui a resposta (protocolo.md:30)
- Juízo e cidade do fecho saem do endereço do autor, sem pergunta; na réplica e no recurso, a comarca onde o processo corre (protocolo.md:32)
- Competência sempre pelas tabelas oficiais, nunca de memória: Caixa no TRF1; demais réus no TJBA (consignado SKILL.md:63; triagem SKILL.md:80)
- Quadro de fatos: cada fato com estado (confirmado, relatado, inferido, desconhecido), valor e proveniência; fato essencial desconhecido impede conclusão definitiva (protocolo.md:38)
- Nada de fato, número de processo, ementa, súmula ou tema inventado; sem fonte no acervo, marca [CONFERIR: fonte] (protocolo.md:46)
- Citação marcada [VERIFICAR ANTES DE PROTOCOLAR] no acervo sai com a marca na peça (protocolo.md:48)
- Marcas de pendência: [CONFERIR…], [PREENCHER…], [VERIFICAR ANTES DE PROTOCOLAR], CÁLCULO A CONFERIR; em negrito no chat, realce amarelo no Word (protocolo.md:170)
- Marca nunca é omitida, resumida ou movida; peça com marca não está pronta para protocolo (protocolo.md:170)
- Marca só sobrevive para julgamento humano (tese, estratégia) ou documento que só o escritório tem (protocolo.md:104)
- Presunções sem marca: benefício é a única renda; cliente não foi consultado nem assinou; ciência dos descontos na data de emissão do extrato (protocolo.md:52-56)
- Migrado: nega-se a migração, nunca a contratação de origem (protocolo.md:57)
- Não recebimento: a peça diz que o banco não comprovou o crédito; extrato bancário do cliente não é pedido nem é pendência (protocolo.md:58)
- Se documento dos autos mostrar crédito: bloco "se crédito em conta" e [DECISÃO DO ADVOGADO: devolução, depósito em juízo ou compensação] (protocolo.md:58)
- Não há tentativa administrativa prévia: não perguntar nem citar, salvo se os documentos trouxerem (protocolo.md:61)
- A presunção cede ao documento; única marca que permanece: pagamento do restante da fatura por boleto no RMC, [CONFERIR: faturas] (protocolo.md:65)
- Dano moral sempre R$ 20.000,00; não citar Súmula 326/STJ para isso (protocolo.md:73; protocolo.md:136)
- Desvio produtivo: não citar a Súmula 30 da TU/TJBA; vale a Súmula 40 (protocolo.md:74)
- Repetição em dobro (art. 42, parágrafo único, CDC) sobre todos os descontos, com EAREsp 676.608/RS; não citar o Tema 929/STJ (protocolo.md:75)
- Correção pela Súmula 43/STJ; juros pela Súmula 54/STJ; no RMC, desde a citação (Súmula 33 TU/TJBA); não citar a Lei 14.905/2024 nos pedidos (protocolo.md:76)
- RMC: não citar a MP 1.393/2026 (protocolo.md:77)
- Norma aplicada pela data do fato: IN 28/2008 até 12/12/2022; IN 138/2022 desde 13/12/2022; correspondente pela Res. 3.954 até 31/1/2022, depois Res. 4.935 (protocolo.md:112-114)
- Não afirmar descumprimento por falta de biometria sem calcular o marco da IN 143/2023 e examinar o acesso autenticado (protocolo.md:113)
- Datas de julgamento e vigência: a skill resolve pelo acervo, depois fonte oficial; sem data, omite o elemento e registra a lacuna na nota de entrega (protocolo.md:97-102)
- Réu: qualificação pela sede na Receita do cadastro; incorporada qualificada pela incorporadora; só sem rede e sem CNPJ sai [CONFERIR] uma vez (protocolo.md:83-93)
- Cálculo: premissas, tabela linha a linha, total refeito por outro caminho, marca CÁLCULO A CONFERIR e validação do advogado (protocolo.md:127-131)
- Descontos contados de Início a Fim, inclusive; ativo conta até o mês anterior à peça; restituição em dobro (protocolo.md:134-135)
- Valor da causa = dobro + dano moral + proveito econômico (parcelas vincendas; no RMC, saldo refinanciado); alerta no JEC acima de 40 salários mínimos (R$ 64.840,00 em 2026) (protocolo.md:137; protocolo.md:63)
- RMC sem histórico completo do cartão: não se redige; pede HISCRE ou faturas, sem estimar competência (protocolo.md:138)
- Dados pessoais: identificador pseudônimo; mascarar CPF e NB na resposta quando desnecessários; não reproduzir documento inteiro (protocolo.md:143)
- Coordenar não dispensa a análise da especialista; o portão de qualidade de cada skill continua valendo (consignado SKILL.md:12)
- Coordenador não cita norma nem precedente por conta própria (consignado SKILL.md:123)
- Toda peça é minuta de trabalho; só o advogado responsável aprova, protocola e assina (protocolo.md:174)
</script>

    [ALERTA] O bloco da IN 138 não examina a prorrogação da biometria pela IN 143 nem o acesso autenticado, que a revisão exige (modelo-inicial-migrado.md:126; padrao-pecas.md:167)
  [GRUPO] Não contratado
    [ALERTA] A tabela de documentos não pede, em linha própria, a identificação do correspondente que a FSC10 exige (modelo-inicial-nao-contratado.md:164; escrutinio-fsc-vf.md:32)
  [GRUPO] Não contratado e migrado
    [ALERTA] As tabelas de mudanças ainda dizem que a cidade do fecho é perguntada; os SKILL.md e o protocolo dizem que vem do endereço, sem pergunta (02-mudancas-no-modelo.md:24; SKILL.md:16)
    [ALERTA] Os SKILL.md tratam "réu sem cadastro" como bloqueio; o protocolo manda resolver por consulta pública ao BCB e à Receita (SKILL.md:33; protocolo.md:88)
[GRUPO] Critérios marcados como proposta, ainda não validados pelo escritório
  [ADV] Escala de gravidade dos indícios: Crítico, Relevante, Reforço (01-roteiro-e-vf.md:70; verificacoes_forenses.md:166)
  [ADV] Limites da geolocalização: 100 m compatível, 150 m divergente, 5 km para IP (verificacoes_forenses.md:167)
  [ADV] Horário atípico de 00h a 05h e etapas a menos de 30 segundos como reforço
  [ADV] Mesma selfie e mesmo IP em contratos diferentes como indício
  [ADV] Quantos dias configuram "intervalo curto" entre contratos (VF8) (verificacoes_forenses.md:91)
  [ADV] Matriz viabilidade × exposição e valor de corte em reais da exposição no recurso (catalogo_fundamentos_sentenca.md:546; catalogo_fundamentos_sentenca.md:566)
  [ADV] Terminologia "credenciamento BACEN" do correspondente (verificacoes_forenses.md:65)
[GRUPO] Pedidos e trechos sem fonte no acervo
  [ADV] RMC: pedidos subsidiários de lesão (art. 157 do CC) e de revisão vêm do AMN e não têm fonte (modelo-inicial-rmc.md:318)
  [ALERTA] RMC: tese do teto em cartão consignado sem precedente no acervo, marcada [VERIFICAR ANTES DE PROTOCOLAR] (01-tese-e-roteiro.md:27)
  [ALERTA] Migrado: art. 290 do CC aplicado à troca de titularidade sem precedente no acervo (01-tese-e-roteiro.md:19)
  [ALERTA] Migrado: há uma petição mais robusta ainda não incorporada (01-tese-e-roteiro.md:23)
  [ALERTA] Leitor do extrato do INSS testado só com extrato fictício: conferir a primeira leitura real contra o PDF (SKILL.md:27)
</script>

<script>
const TIPOS={FAZ:['faz','A skill faz'],CONFERE:['conf','A skill confere'],ADV:['adv','Advogado decide'],ALERTA:['alr','Alerta'],BLOQ:['blq','Bloqueio'],FIM:['fim','Entrega'],GRUPO:['grupo',''],REGRA:['faz','Regra']};
function parse(txt){
  const raiz={k:'raiz',t:'',kids:[]};const pilha=[{nivel:-1,no:raiz}];
  txt.replace(/\t/g,'  ').split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const nivel=Math.floor((l.length-l.trimStart().length)/2);let s=l.trim();
    if(s.startsWith('# ')){raiz.t=s.slice(2).trim();return}
    if(s.startsWith('- ')||s.startsWith('* '))s='[REGRA] '+s.slice(2);
    let no,filho=null;
    if(s.startsWith('→')){
      s=s.replace(/^→\s*/,'');
      /* "→ Sim: [BLOQ] texto (fonte)" vira o ramo "Sim" com um filho */
      const m=s.match(/^(.+?):\s+(\[\w+\].*)$/)||s.match(/^(.{1,90}?):\s+(\S.*)$/);
      if(m&&!/^\(/.test(m[2])){no={k:'ramo',t:m[1],kids:[]};filho=item(m[2])}
      else{const mf=fonte(s.replace(/:\s*$/,''));no={k:'ramo',t:mf.t,src:mf.src,kids:[]}}
    }else no=item(s);
    while(pilha.length&&pilha[pilha.length-1].nivel>=nivel)pilha.pop();
    pilha[pilha.length-1].no.kids.push(no);pilha.push({nivel,no});
    if(filho)no.kids.push(filho);
  });
  return raiz;
}
function fonte(s){let src='';const ms=s.match(/\s*\(([^()]*\.(?:md|py|json|txt)[^()]*)\)\s*$/);if(ms){src=ms[1];s=s.slice(0,ms.index).trim()}return{t:s,src}}
function item(s){
  const m=s.match(/^\[(\w+)\]\s*(.*)$/);const tipo=m&&TIPOS[m[1].toUpperCase()]?m[1].toUpperCase():'FAZ';
  if(m)s=m[2];const f=fonte(s);
  return{k:TIPOS[tipo][0],tag:TIPOS[tipo][1],t:f.t,src:f.src,kids:[]};
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function conta(no){return no.kids.reduce((a,k)=>a+1+conta(k),0)}
function cardHTML(no){
  const cls=no.k==='raiz'?'raiz':no.k;
  const tem=no.kids.length;
  return '<div class="card '+cls+'"'+(tem?' data-k tabindex="0" role="button" aria-expanded="true"':'')+'>'+
    (no.tag?'<span class="tg">'+no.tag+'</span>':'')+'<span class="tx">'+esc(no.t)+'</span>'+
    (no.src?'<span class="src">'+esc(no.src)+'</span>':'')+(tem?'<span class="mais">+'+conta(no)+'</span>':'')+'</div>';
}
function mapaHTML(no,d){
  return '<div class="n" data-d="'+d+'">'+cardHTML(no)+(no.kids.length?'<div class="kids">'+no.kids.map(k=>mapaHTML(k,d+1)).join('')+'</div>':'')+'</div>';
}
function listaHTML(no){return '<li>'+cardHTML(no).replace(' data-k tabindex="0" role="button" aria-expanded="true"','')+(no.kids.length?'<ul>'+no.kids.map(listaHTML).join('')+'</ul>':'')+'</li>'}

const blocos=[...document.querySelectorAll('script[type="text/plain"][data-id]')].map(s=>({id:s.dataset.id,nome:s.dataset.nome,sub:s.dataset.sub||'',arvore:parse(s.textContent)}));
const $=s=>document.querySelector(s);
let atual=null,zoom=1,vista='mapa';
$('#tabs').innerHTML=blocos.map(b=>'<button class="tab" role="tab" data-id="'+b.id+'">'+esc(b.nome)+'</button>').join('');

function nivel(n){document.querySelectorAll('#mapa .n').forEach(e=>{const d=+e.dataset.d;const f=d>=n&&e.querySelector(':scope>.kids');e.classList.toggle('fechado',!!f);const c=e.querySelector(':scope>.card[data-k]');if(c)c.setAttribute('aria-expanded',!f)})}
function mostra(id){
  atual=blocos.find(b=>b.id===id)||blocos[0];
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===atual.id));
  $('#sub').textContent=atual.sub;
  $('#mapa').innerHTML=mapaHTML(atual.arvore,0);
  $('#lista').innerHTML='<ul>'+listaHTML(atual.arvore)+'</ul>';
  nivel(1);centra();busca();
  try{history.replaceState(null,'','#'+atual.id)}catch(e){}
}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)mostra(t.dataset.id)});
function alterna(card){const n=card.parentElement;n.classList.toggle('fechado');card.setAttribute('aria-expanded',!n.classList.contains('fechado'))}
$('#mapa').addEventListener('click',e=>{const c=e.target.closest('.card[data-k]');if(c&&!movido)alterna(c)});
$('#mapa').addEventListener('keydown',e=>{const c=e.target.closest('.card[data-k]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();alterna(c)}});
function centra(){const V=$('#vista'),r=$('#mapa .card.raiz');if(!r||vista!=='mapa'){V.scrollTo(0,0);return}
  const vb=V.getBoundingClientRect(),rb=r.getBoundingClientRect();V.scrollTo(0,Math.max(0,V.scrollTop+rb.top-vb.top-V.clientHeight/2+rb.height/2))}
document.querySelectorAll('[data-nivel]').forEach(b=>b.addEventListener('click',()=>{nivel(+b.dataset.nivel);centra()}));
function setZoom(z){zoom=Math.min(1.6,Math.max(.4,z));$('#mapa').style.zoom=zoom;$('#zReset').textContent=Math.round(zoom*100)+'%'}
$('#zMais').onclick=()=>setZoom(zoom+.1);$('#zMenos').onclick=()=>setZoom(zoom-.1);$('#zReset').onclick=()=>setZoom(1);
function setVista(v){vista=v;$('#mapa').hidden=v!=='mapa';$('#lista').hidden=v!=='lista';$('#vMapa').setAttribute('aria-pressed',v==='mapa');$('#vLista').setAttribute('aria-pressed',v==='lista');busca()}
$('#vMapa').onclick=()=>setVista('mapa');$('#vLista').onclick=()=>setVista('lista');
$('#soAdv').onchange=e=>document.body.classList.toggle('so-adv',e.target.checked);
$('#fontes').onchange=e=>document.body.classList.toggle('fontes',e.target.checked);
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function busca(){
  const q=norm($('#busca').value.trim());const raiz=vista==='mapa'?$('#mapa'):$('#lista');
  document.querySelectorAll('.card.hit').forEach(c=>c.classList.remove('hit'));
  if(!q){$('#count').textContent='';return}
  let n=0,primeiro=null;
  raiz.querySelectorAll('.card').forEach(c=>{if(norm(c.textContent).includes(q)){c.classList.add('hit');n++;primeiro=primeiro||c;
    let p=c.parentElement;while(p&&p!==raiz){if(p.classList.contains('n')){p.classList.remove('fechado');const k=p.querySelector(':scope>.card[data-k]');if(k)k.setAttribute('aria-expanded',true)}p=p.parentElement}
    const self=c.parentElement;if(self.classList.contains('fechado')){}}});
  $('#count').textContent=n?n+' encontrado'+(n>1?'s':''):'nada encontrado';
  if(primeiro)primeiro.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
}
let t;$('#busca').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(busca,200)});
/* arrastar para mover */
let arr=null,movido=false;const V=$('#vista');
V.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('input,button'))return;arr={x:e.clientX,y:e.clientY,sl:V.scrollLeft,st:V.scrollTop};movido=false});
window.addEventListener('pointermove',e=>{if(!arr)return;const dx=e.clientX-arr.x,dy=e.clientY-arr.y;if(Math.abs(dx)+Math.abs(dy)>4){movido=true;V.classList.add('arrastando')}if(movido){V.scrollLeft=arr.sl-dx;V.scrollTop=arr.st-dy}});
window.addEventListener('pointerup',()=>{arr=null;V.classList.remove('arrastando');setTimeout(()=>movido=false,0)});
mostra(location.hash.slice(1));
</script>
</body>
